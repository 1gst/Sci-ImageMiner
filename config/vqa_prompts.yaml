# VQA 任务提示词配置文件（所有版本）

# VQA 答案类型说明 v1
instructions_v1:
  "Yes/No": |
    Answer with only 'Yes' or 'No'.
  "Factoid": |
    Provide a concise, specific answer (a single term or phrase).
  "List": |
    Provide a comma-separated list of items (order is not important).
  "Paragraph": |
    Provide a detailed explanatory answer with at least 3 sentences. If necessary, use the data in the image and other relevant information to provide further explanation.

# VQA 答案类型说明 v2
instructions_v2:
  "Yes/No": |
    Answer with only 'Yes' or 'No'. Do NOT add any explanation or additional words.
  "Factoid": |
    Provide a concise but complete answer (typically 1-10 words or a short phrase).
    - If the correct answer requires explanation or multiple components, do NOT oversimplify
    - Do NOT answer with just 'Yes' or 'No' (use the Yes/No type for those)
    - Include necessary scientific context (e.g., units, conditions, substance names)
    Example questions and appropriate answers:
    - "What is the energy barrier?" -> "21 kcal/mol" (NOT "high" or "barrier")
    - "What surface property enables chemisorption?" -> "Lewis acid sites (Al3+ centers)" (NOT "acid sites")
    - "What does the figure show?" -> "Linear growth with constant growth-per-cycle" (NOT "linear growth")
  "List": |
    Provide a comma-separated list of items.
    - Order is not important
    - Include all relevant items mentioned in the paper or visible in the figure
    - Be comprehensive but avoid redundancy
  "Paragraph": |
    Provide a detailed explanatory answer with at least 3 sentences.
    - Ground your answer in specific visual evidence
    - Reference relevant data points or features shown in the figure
    - Explain the scientific significance or implications

# VQA 答案类型说明 v3 (保守优化：只去 preamble，保持 v2 长度)
instructions_v3:
  "Yes/No": |
    Answer with only 'Yes' or 'No'. Do NOT add any explanation or additional words.
  "Factoid": |
    Provide a concise but complete answer (typically 1-10 words or a short phrase).
    - If the correct answer requires explanation or multiple components, do NOT oversimplify
    - Do NOT answer with just 'Yes' or 'No' (use the Yes/No type for those)
    - Include necessary scientific context (e.g., units, conditions, substance names)
    - DO NOT begin with "Based on..." or any preamble - state the answer directly
    Example questions and appropriate answers:
    - "What is the energy barrier?" -> "21 kcal/mol" (NOT "high" or "barrier")
    - "What surface property enables chemisorption?" -> "Lewis acid sites (Al3+ centers)" (NOT "acid sites")
    - "What does the figure show?" -> "Linear growth with constant growth-per-cycle" (NOT "linear growth")
  "List": |
    Provide a comma-separated list of items.
    - Order is not important
    - Include all relevant items mentioned in the paper or visible in the figure
    - Be comprehensive but avoid redundancy
  "Paragraph": |
    Provide a concise explanatory answer in 2-3 sentences (around 40-60 words).
    - DO NOT begin with "Based on the visual content of..." or similar preambles
    - Start directly with the answer content
    - DO NOT write long analytical essays or step-by-step reasoning
    - Reference specific visual features or data from the figure
    - Include specific data values, measurements, and observations

