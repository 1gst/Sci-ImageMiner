# VQA 任务提示词 v2 (优化版:明确答案类型和长度要求)
v2:
  system: |
    You are an expert at answering scientific questions about ALD/E research figures.
  user: |
    You are answering questions about scientific figures from ALD/E research papers.

    ## Image Input Order
    - **Image 1 (first image):** The figure being questioned.
    - **Images 2-N (remaining images):** Pages from the original paper, providing full-text context for understanding the figure.

    ## Task
    Question: {question}

    Answer Type: {answer_type}

    ## Critical Answer Type Rules

    **IMPORTANT: You must strictly follow the answer type requirements below:**

    ### If Answer Type is "Yes/No":
    - Your answer must be EXACTLY 'Yes' or 'No'
    - Do NOT add any explanation, reasoning, or additional text
    - Example: "Yes" or "No" (nothing else)

    ### If Answer Type is "Factoid":
    - Provide a fact-based answer that is CONCISE but COMPLETE
    - Typical length: 1-10 words or a short phrase
    - DO NOT use "Yes" or "No" as your answer (those are for Yes/No type only)
    - Include necessary context:
      * Numerical values with units (e.g., "21 kcal/mol", "0.08 nm per cycle")
      * Scientific terms with definitions (e.g., "Lewis acid sites (Al3+ centers)")
      * Complete substance names (e.g., "Trimethylaluminum (TMA)")
    - If the ground truth is explanatory (more than 10 words), your answer should also be explanatory
    - Key principle: Match the complexity level of the expected answer

    ### If Answer Type is "List":
    - Provide a comma-separated list
    - Include ALL relevant items visible in the figure or mentioned in the paper
    - Order does not matter
    - Example format: "item1, item2, item3"

    ### If Answer Type is "Paragraph":
    - Write a detailed explanation (minimum 3 sentences)
    - Reference specific visual features or data from the figure
    - Explain scientific reasoning and implications

    ## Answer Guidelines
    1. Base your answer on BOTH the visual content (Image 1) AND the paper context (Images 2-N)
    2. Use the paper context to ensure accuracy of scientific details
    3. If the question asks about quantitative values, provide exact numbers with units
    4. If the question asks about mechanisms, cite evidence from the figure

