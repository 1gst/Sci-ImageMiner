# 分类任务提示词配置文件（所有版本）

# 分类任务提示词 v1
v1:
  system: |
    You are an expert at classifying scientific figures from ALD/ALE research papers.

  user: |
    Classify the scientific figure(s) below into one of {class_count} categories.

    ## Category Taxonomy
    {classes}

    ## Decision Guide

    **Step 1: Is this a quantitative plot (has labeled axes with numerical data)?**
    If YES, determine axis types:
    - X-axis is spectroscopic (wavenumber, binding energy, 2θ, Raman shift, m/z) → spectra / multi spectra / stacked spectra chart
    - X-axis is general physical quantity (temperature, time, cycles, thickness, pressure) → line chart / scatter plot / multiple variants
    - Then check: points connected by lines → line chart variant; discrete markers only → scatter plot variant
    - Single series → singular form; multiple series → "multiple" variant
    - Two Y-axes → multi-axis chart

    **Step 2: Is this a schematic/diagram (no quantitative axes)?**
    Apply this priority order:
    1. **molecular structure diagram** — Can you see individual atoms rendered as colored spheres with bonds as sticks? (ball-and-stick, space-filling models, 2D structural formulas) → YES = molecular structure diagram, even if atoms are on a surface/substrate
    2. **reaction scheme** — Are there reaction arrows (→, ⇌) showing chemical transformation between species? → YES = reaction scheme
    3. **process flow diagram** — Are there numbered/ordered procedural steps with action labels? → YES = process flow diagram
    4. **device structure diagram** — Is it a static layered cross-section of a fabricated device? → YES = device structure diagram
    5. **conceptual diagram** — None of the above matched → conceptual diagram

    ## High-Frequency Confusion Rules

    | If predicting... | Check this... | Correct answer |
    |---|---|---|
    | conceptual diagram | Are individual atoms visible as spheres/balls with bond sticks? | → molecular structure diagram |
    | conceptual diagram | Are there arrows (→) showing chemical transformation between species? | → reaction scheme |
    | reaction energy profile diagram | Is X-axis a concrete quantity (T, time, distance, cycles)? | → line chart / scatter plot |
    | reaction energy profile diagram | Does it show molecular structures with reaction arrows alongside energy? | → reaction scheme |
    | line chart | Are data points discrete markers WITHOUT connecting lines? | → scatter plot |
    | multiple line chart | Are data points discrete markers WITHOUT connecting lines? | → multiple scatter plot |
    | multi spectra chart | Is X-axis a general physical quantity (not spectroscopic)? | → multiple line chart |
    | image panel | Does the figure not match ANY of the 48 defined categories? | → unknown |
    | process flow diagram | Does it show chemical structures with reaction arrows? | → reaction scheme |

    ## Sub-figure Handling
    - If the figure contains sub-figures (labeled a, b, c, d...), classify EACH separately.
    - If no sub-figure labels are visible, use "a" as the default key.

    Caption: {caption}

    {example_reference}

    ## Output
    Return ONLY a valid JSON dictionary. Use EXACT category names from the taxonomy.
    Example: {{"a": "scatter plot", "b": "line chart"}}
    Please fill in the category for each sub-image in the JSON below (corresponding to the sub-images in the first image).
    {uncategorized_dict}

  example_reference_template: |
    ## Reference Examples
    The following images (starting with the second image; the first image is an unclassified image) show examples of various categories, with the image type indicated in red text; some categories do not have examples. Please use these examples to calibrate your judgment.

# 分类任务提示词 v2
v2:
  system: |
    You are an expert at classifying scientific figures from ALD/ALE research papers.

  user: |
    Classify the scientific figure(s) below into one of {class_count} categories.

    ## Category Taxonomy
    {classes}

    ## Step-by-Step Decision Guide

    **CRITICAL FIRST STEP: Determine if this is a QUANTITATIVE PLOT or a SCHEMATIC DIAGRAM**
    
    ### A. QUANTITATIVE PLOTS (has labeled axes with numerical data)
    
    **Step A1: Check X-axis type**
    - X-axis is spectroscopic (wavenumber, binding energy, 2θ, wavelength, Raman shift, m/z)
      → Go to Step A2a (spectra variants)
    - X-axis is general physical quantity (temperature, time, cycles, thickness, pressure, distance)
      → Go to Step A2b (line/scatter variants)
    
    **Step A2a: Spectroscopic X-axis**
    - Single spectrum → 'spectra chart'
    - Multiple spectra on SAME baseline → 'multi spectra chart'
    - Multiple spectra VERTICALLY STACKED with separate baselines → 'stacked spectra chart'
    
    **Step A2b: General physical quantity X-axis**
    - Single data series with CONNECTED lines → 'line chart'
    - Single data series with DISCRETE markers only (NO lines) → 'scatter plot'
    - Multiple series with CONNECTED lines → 'multiple line chart'
    - Multiple series with DISCRETE markers only (NO lines) → 'multiple scatter plot'
    - Two Y-axes (left and right) → 'multi-axis chart'
    - Time-axis with rectangular/pulsed waveforms → 'process timing diagram'
    
    ### B. SCHEMATIC DIAGRAMS (no quantitative axes)
    
    **Apply this EXACT priority order (do NOT skip steps):**
    
    1. **molecular structure diagram** — Can you clearly see individual atoms rendered as colored 
       SPHERES/BALLS with bonds as sticks? (ball-and-stick, space-filling models, 2D structural 
       formulas with element symbols)
       → YES = molecular structure diagram, even if atoms are on a surface/substrate
       → NO = Go to step 2
    
    2. **reaction scheme** — Are there reaction arrows (→, ⇌, or curved arrows) showing chemical 
       TRANSFORMATION between species (reactants → products)?
       → YES = reaction scheme
       → NO = Go to step 3
    
    3. **reaction energy profile diagram** — ALL THREE must be TRUE:
       (a) Y-axis labeled with energy units (eV, kcal/mol, kJ/mol, Hartree)
       (b) X-axis labeled "Reaction coordinate" or "Reaction path" (NOT temperature/time/distance)
       (c) Labeled chemical states (reactants, TS, intermediates, products) at energy levels
       → ALL TRUE = reaction energy profile diagram
       → ANY FALSE = NOT this category, go to step 4
    
    4. **process flow diagram** — Are there numbered/ordered PROCEDURAL steps with action labels 
       (e.g., "Precursor pulse", "N2 purge", "Plasma exposure") connected by arrows?
       → YES = process flow diagram
       → NO = Go to step 5
    
    5. **device structure diagram** — Is it a static layered cross-section of a fabricated device 
       with material layers (substrate, oxide, metal, dielectric) labeled?
       → YES = device structure diagram
       → NO = Go to step 6
    
    6. **apparatus diagram** — Does it show laboratory equipment layout (reactors, chambers, pumps, 
       gas lines) rather than a device cross-section?
       → YES = apparatus diagram
       → NO = Go to step 7
    
    7. **conceptual diagram** — None of the above matched. This is the default for schematic 
       illustrations explaining concepts, mechanisms, or theoretical models.
       → conceptual diagram
    
    ## Critical Decision Rules (High-Frequency Errors)
    
    | Mistake | Correction Check | Correct Category |
    |---|---|---|
    | Over-using 'reaction energy profile diagram' | Is X-axis a concrete quantity (T, time, distance, cycles)? | → line chart / scatter plot / multiple variants |
    | Over-using 'reaction energy profile diagram' | Does it show molecular structures with → arrows? | → reaction scheme |
    | 'line chart' vs 'scatter plot' | Are markers connected by lines? | Connected → line chart; Discrete only → scatter plot |
    | 'multiple line chart' vs 'multiple scatter plot' | Are markers connected by lines? | Connected → multiple line chart; Discrete only → multiple scatter plot |
    | 'multi spectra chart' misuse | Is X-axis spectroscopic? | No → multiple line chart |
    | 'conceptual diagram' over-use | Are individual atoms rendered as spheres/balls? | Yes → molecular structure diagram |
    | 'conceptual diagram' over-use | Are there reaction arrows (→)? | Yes → reaction scheme |
    | 'image panel' over-use | Does it NOT match any of 48 categories? | → unknown (NOT image panel) |
    | 'process flow diagram' vs 'reaction scheme' | Does it show chemical structures with → arrows? | Yes → reaction scheme |
    
    ## Sub-figure Handling
    - If the figure contains sub-figures (labeled a, b, c, d...), classify EACH separately.
    - If no sub-figure labels are visible, use "a" as the default key.

    Caption: {caption}

    {example_reference}

    ## Output
    Return ONLY a valid JSON dictionary. Use EXACT category names from the taxonomy.
    Example: {{"a": "scatter plot", "b": "line chart"}}
    Please fill in the category for each sub-image in the JSON below (corresponding to the sub-images in the first image).
    {uncategorized_dict}

  example_reference_template: |
    ## Reference Examples
    The following images (starting with the second image; the first image is an unclassified image) show examples of various categories, with the image type indicated in red text; some categories do not have examples. Use these examples to calibrate your judgment.

