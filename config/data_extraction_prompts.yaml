# 数据提取任务提示词配置文件（所有版本）

# 数据提取任务提示词 v1
v1:
  system: |
    You are an expert at extracting data from scientific charts and plots.
  user: |
    You are tasked with extracting tabular data from scientific charts or plots in ALD/E research papers.

    ## Image Input Order
    - **Image 1 (first image):** The chart or plot to extract data from.
    - **Images 2-N (remaining images):** Pages from the original paper, providing full-text context for understanding the figure.

    Your task:
    1. Analyze the visual chart or plot to determine if it contains extractable tabular data
    2. Extractable data types include: bar charts, line charts, scatter plots, spectra (XPS, Raman, FTIR, etc.), phase diagrams with quantitative axes, etc.
    3. Non-extractable types include: microscopy images (SEM, TEM, AFM), cluster diagrams, qualitative schemes, setup diagrams, mechanism diagrams, etc.
    4. IF the figure contains extractable quantitative data:
       - Identify column/field labels (axes labels, legend labels, etc.)
       - Extract numerical or text values from the chart
       - Format the data as a GitHub-compatible Markdown table
    5. IF the figure does NOT contain extractable quantitative data:
       - Return an empty string ""
    6. Be careful with escape characters in the string; otherwise, parsing errors may occur. Ensure that `json.loads()` can parse the data correctly.

    Additional Context - Caption: {caption}

    Requirements for extractable charts:
    - Use standard GitHub Markdown syntax for tables
    - Enclose the table between ```markdown and ``` markers
    - Include column headers as the first row
    - Extract as many data points as possible (approximate values are acceptable)

    Example for extractable chart:
    ```markdown
    | Temperature (°C) | Growth Rate (Å/cycle) |
    | --- | --- |
    | 200 | 0.85 |
    | 250 | 1.10 |
    ```

    Format your response as a JSON dictionary with sub-figure labels as keys (a, b, c, d) and markdown tables as values, ensure it is valid JSON..
    Example:
    {{
      "a": "| Temperature (°C) | Growth Rate (Å/cycle) |\n| --- | --- |\n| 200 | 0.85 |\n| 250 | 1.10 |",
      "b": ""
    }}
    If no sub-figures is specified, the default is a. Use an empty string "" for sub-figures that do not contain extractable data.

# 数据提取任务提示词 v2 (优化版:强化表格结构、数据精度和格式规范)
v2:
  system: |
    You are an expert at extracting data from scientific charts and plots.
  user: |
    You are tasked with extracting tabular data from scientific charts or plots in ALD/E research papers.

    ## Image Input Order
    - **Image 1 (first image):** The chart or plot to extract data from.
    - **Images 2-N (remaining images):** Pages from the original paper, providing full-text context for understanding the figure.

    ## Task Overview
    1. Determine if the figure contains extractable quantitative data
    2. If YES, extract data and format as a table matching the visual structure
    3. If NO, return empty string ""

    ## Extractable vs Non-extractable

    **Extractable (return table):**
    - Bar charts, line charts, scatter plots with quantitative axes
    - Spectra (XPS, Raman, FTIR, XRD patterns, etc.)
    - Phase diagrams, ternary plots with numerical scales
    - Any chart with labeled axes showing quantitative relationships

    **Non-extractable (return ""):**
    - Microscopy images (SEM, TEM, AFM, etc.)
    - Cluster diagrams, dendrograms
    - Qualitative schemes, flow diagrams
    - Setup diagrams, apparatus diagrams
    - Mechanism diagrams, reaction schemes

    ## Critical Table Extraction Rules

    **Rule 1: Match Visual Table Structure**
    - COUNT the number of distinct data series shown in the figure
    - Each legend item = one data series (column)
    - Example: If figure shows 3 curves with legend "Sample A, Sample B, Sample C"
      → Table should have columns: X-axis label | Sample A | Sample B | Sample C

    **Rule 2: Column Header Format**
    - Use the EXACT axis label from the figure (including units)
    - For multiple conditions, put condition name in column header
    - Example: "NiO_Alanis (nm)" not just "Thickness"

    **Rule 3: Data Precision Representation**
    - Use "~" prefix for approximate/read values: ~0.34, ~1.5
    - Use "-" for missing/unmeasured data points
    - Use scientific notation when appropriate: 1.5e-5, 3.2e4
    - Include uncertainty if shown: 0.28 ± 0.02

    **Rule 4: Data Sampling Strategy**
    - Extract data at REGULAR intervals (not every single pixel)
    - For smooth curves: extract ~10-15 representative points
    - For spectra: extract key peaks and ~5-10 baseline points
    - Include key features: peaks, valleys, inflection points

    **Rule 5: Table Format**
    - DO NOT wrap table in ```markdown``` code blocks
    - Use standard GitHub Markdown syntax
    - Align columns consistently (left or center)

    ## Example Extracted Tables

    **Example 1: Multiple line chart**
    Figure shows 3 curves with X-axis "Temperature (°C)", Y-axis "Growth Rate (Å/cycle)", 
    legend: "Sample A, Sample B, Sample C"

    Correct table:
    | Temperature (°C) | Sample A (Å/cycle) | Sample B (Å/cycle) | Sample C (Å/cycle) |
    | --- | --- | --- | --- |
    | 100 | ~0.85 | ~0.92 | ~0.78 |
    | 150 | ~1.10 | ~1.25 | ~0.95 |
    | 200 | ~1.35 | ~1.50 | ~1.15 |

    **Example 2: Spectrum with peak positions only**
    Figure shows XPS spectrum with X-axis "Binding Energy (eV)", Y-axis "Intensity (a.u.)"

    Correct table (peak-focused):
    | Binding Energy (eV) | Intensity (a.u.) |
    | --- | --- |
    | 98.5 | ~0.2 |
    | 99.0 | 1.0 (peak) |
    | 99.5 | ~0.6 |
    | 100.0 | ~0.3 |

    **Example 3: Surface composition depth profile**
    Figure shows sputter time vs. atomic percentages for multiple elements

    Correct table:
    | Sputter Time (min) | W (%) | C (%) | N (%) | O (%) | Si (%) |
    | --- | --- | --- | --- | --- | --- |
    | 0 | ~10 | ~15 | ~8 | ~2 | 0 |
    | 5 | ~48 | ~30 | ~10 | ~1 | 0 |
    | 10 | ~52 | ~32 | ~11 | ~1 | 0 |
    | 15 | ~50 | ~30 | ~10 | ~1 | 0 |
    | 20 | ~25 rising | ~10 | ~5 | ~5 rising | ~30 rising |

    ## Common Mistakes to Avoid
    - Wrong number of columns (count legend items carefully!)
    - Missing "~" for approximate read values
    - Over-extracting data (too many rows, noisy)
    - Under-extracting data (missing key features)
    - Wrong column headers (not matching axis labels)

    Additional Context - Caption: {caption}

    ## Output Format
    Return a JSON dictionary with sub-figure labels as keys and markdown tables as string values.
    
    Example:
    {{
      "a": "| X-axis Label | Data Series 1 | Data Series 2 |\n| --- | --- | --- |\n| value1 | value1a | value1b |\n| value2 | value2a | value2b |",
      "b": ""
    }}

    Use "a" as default key if no sub-figure labels. Use "" for non-extractable figures.

